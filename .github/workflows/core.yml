name: Core build and resources
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow numpy
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generated resources and translations
        run: |
          python tools/generate_data.py --check
          python tools/generate_textures.py --check
          python tools/generate_textures.py --project-icon --check
          python tools/generate_sounds.py --check
          python tools/check_release.py
      - name: Clean core build, units and GameTests (no optional jars)
        run: ./gradlew --no-daemon clean build runGameTestServer
      - name: Check packaged contents
        run: python tools/check_release.py --jar build/libs/immersive-brewing-*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-validation
          path: |
            build/reports/tests/
            run-gametest/logs/latest.log
            docs/reports/gametest-coverage-report.txt
