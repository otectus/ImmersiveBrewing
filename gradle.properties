immersive_jewelry_version_range=[1.0,)
immersive_enchanting_version=1.1.0
immersive_enchanting_version_range=[1.0,)
# Third-party potion mods (data under compat/, each behind forge:mod_loaded): libs/ jars, compileOnly, never shipped.
# runtimeOnly in dev with -PwithApothecary, -PwithMorePotions, -PwithPotionsMaster, -PwithRpgPotions, or -PwithPotionMods.
apothecary_version=1.5.2-1.20.1
morepotions_version=1.0.4
potionsmaster_version=1.20.1-47.1.70-0.6.0
# CurseForge file version; the jar's own mods.toml says 1.1.3
rpg_potions_version=1.2.0
